<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>東方紅魔郷 — EoSD (web beta)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0a0a12; color: #e8e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #shell {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.2rem; text-align: center; padding: clamp(1rem, 4vw, 2rem);
  }
  h1 { font-weight: 600; letter-spacing: 0.04em; margin: 0; }
  .sub { color: #8a8aa0; font-size: 0.9rem; max-width: 32rem; line-height: 1.5; }
  select {
    background: #0d0d16; border: 1px solid #33334a; border-radius: 8px;
    color: #fff; padding: 0.6rem 0.8rem; font-size: 1rem; width: 14rem;
  }
  button {
    background: #b3123a; color: #fff; border: 0; border-radius: 8px;
    padding: 0.6rem 1.4rem; font-size: 1rem; cursor: pointer;
  }
  button:hover { background: #d11646; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .err { color: #ff6b81; font-size: 0.85rem; min-height: 1rem; }
  .hidden { display: none !important; }
  /* While playing, the canvas takes over the whole viewport, centered on black. */
  body.playing #shell { display: none; }
  body.playing { display: flex; align-items: center; justify-content: center; margin: 0; height: 100vh; background: #000; }
  /* The drawing buffer stays 640x480; CSS scales the display up to fill the
     viewport while keeping 4:3 (nearest-neighbour). !important beats the inline
     size winit puts on the canvas. */
  #th06-canvas {
    display: block; background: #000;
    image-rendering: pixelated;
    aspect-ratio: 4 / 3;
    width: min(100vw, 133.333vh) !important;
    height: auto !important;
    max-height: 100vh;
  }
  #th06-canvas:fullscreen {
    width: 100vw !important; height: 100vh !important;
    object-fit: contain; max-height: none;
  }
  #fsBtn {
    position: fixed; top: 10px; right: 12px; z-index: 10; opacity: 0.55;
    background: #15151f; color: #fff; border: 1px solid #33334a; border-radius: 8px;
    padding: 0.35rem 0.8rem; font-size: 0.85rem; cursor: pointer;
  }
  #fsBtn:hover { opacity: 1; }
  body:not(.playing) #fsBtn { display: none; }
  #status { color: #9a9ab0; font-size: 0.85rem; }
  #gameTools { position: fixed; left: 12px; top: 10px; z-index: 10; padding: 0.35rem 0.8rem; font-size: 0.85rem; }
  body:not(.playing) #gameTools { display: none; }
  #persistenceError { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 20; max-width: min(90vw, 38rem); padding: 0.7rem 1rem; background: #431b29; color: #fff; border-radius: 8px; font-size: 0.85rem; }
  #persistenceError:empty { display: none; }
  dialog { color: #e8e8f0; background: #15151f; border: 1px solid #33334a; border-radius: 12px; max-width: min(32rem, 85vw); }
  dialog::backdrop { background: #000a; }
  .tool-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin: 1rem 0; }
</style>
</head>
<body>
<div id="shell">
  <h1>東方紅魔郷 <span style="color:#b3123a">·</span> Embodiment of Scarlet Devil</h1>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="error" class="err" role="alert"></div>
  <button id="retry" class="hidden" data-i18n="retry">Réessayer</button>
</div>

<button id="fsBtn" title="Plein écran (F)" data-i18n="fullscreen" data-i18n-title="fullscreenTitle">⛶ Plein écran</button>
<button id="gameTools" data-i18n="tools">Scores et replays</button>
<div id="persistenceError" role="alert" aria-live="assertive"></div>
<dialog id="dataDialog">
  <h2 data-i18n="toolsTitle">Sauvegardes et replays</h2>
  <p class="sub" data-i18n="toolsIntro">Les imports remplacent la sauvegarde ou le replay choisi sur cet appareil.</p>
  <div class="tool-row"><button id="importScore" data-i18n="importScore">Importer score.dat</button><button id="exportScore" data-i18n="exportScore">Exporter score.dat</button></div>
  <div class="tool-row"><label for="replaySlot" data-i18n="replaySlot">Emplacement du replay</label><select id="replaySlot"></select></div>
  <div class="tool-row"><button id="importReplay" data-i18n="importReplay">Importer un replay</button><button id="exportReplay" data-i18n="exportReplay">Exporter le replay</button></div>
  <p id="dataStatus" role="status" aria-live="polite"></p>
  <button id="closeData" data-i18n="close">Fermer</button>
</dialog>
<input id="scoreFile" type="file" accept=".dat" hidden />
<input id="replayFile" type="file" accept=".rpy" hidden />

<script type="module">
const $ = id => document.getElementById(id);
// Optional shared site UI is hosted outside the game project. Keep the runtime
// hooks available while that module downloads; gameplay never waits for it.
const pendingResults = [];
window.__th06GameLanguage = "fr";
window.__th06OnLanguageChanged = code => { window.__th06GameLanguage = code; };
window.__th06SubmitScore = payload => { if (pendingResults.length < 50) pendingResults.push(payload); };
window.__th06TakePendingResults = () => pendingResults.splice(0);
function loadSharedInterface() {
  import("/platform/community.js").catch(() => setTimeout(loadSharedInterface, 30000));
}
loadSharedInterface();
const ui = (key, fallback, values = {}) => window.__th06Text?.(key, values)
  || fallback.replace(/\{(\w+)\}/g, (match, name) => values[name] ?? match);
const REQUIRED = ["TL.DAT", "CM.DAT", "ST.DAT", "IN.DAT"];
const ARCHIVES = [...REQUIRED, "ED.DAT", "MD.DAT", "th06e_ST.DAT", "th06e_ED.DAT", "th06e_MD.DAT", "th06e_IN.DAT", "th06e_CM.DAT"];
const MAX_FILE = 64 * 1024 * 1024, MAX_TOTAL = 1024 * 1024 * 1024;
let busy = false, manifest = null, version = "", runtimePromise = null, runtimeApi = null;
const status = $("status"), error = $("error");

function canonicalName(name) {
  const base = name.split(/[\\/]/).pop().toLowerCase();
  const archive = ARCHIVES.find(value => value.toLowerCase() === base);
  if (archive) return archive;
  if (/^th06_(0[1-9]|1[0-7])\.(wav|ogg|pos)$/.test(base) || /^th6_(0[1-9]|1[0-5])\.rpy$/.test(base) || ["score.dat", "musiccmt.txt", "gm.sf2", "msgothic.ttc", "msgothic.ttf"].includes(base)) return base;
  return null;
}
function complete(map) {
  const missing = REQUIRED.filter(name => !(map[name] instanceof Uint8Array) || map[name].byteLength === 0);
  if (missing.length) throw new Error(ui("missingFiles", "Fichiers manquants : {files}", { files: missing.join(", ") }));
  return map;
}
function versioned(path) {
  const url = new URL(path, location.href);
  if (version) url.searchParams.set("v", version);
  return url.href;
}
function loadRuntime() {
  if (!runtimePromise) runtimePromise = (async () => {
    const runtimeUrl = versioned("./pkg/th06.js");
    const runtime = await import(runtimeUrl);
    const response = await fetch(versioned("./pkg/th06_bg.wasm"));
    if (!response.ok) throw new Error(ui("engineUnavailable", "Le moteur du jeu n’a pas pu être chargé."));
    const compiledModule = typeof WebAssembly.compileStreaming === "function" && response.headers.get("Content-Type")?.split(";")[0] === "application/wasm"
      ? await WebAssembly.compileStreaming(response)
      : await WebAssembly.compile(await response.arrayBuffer());
    await runtime.default({ module_or_path: compiledModule });
    window.__th06CreateMidiWorklet = async context => {
      if (!context.audioWorklet || !window.AudioWorkletNode) return null;
      const source = `import { registerMidiProcessor } from ${JSON.stringify(versioned("./midi-worklet.js"))};\nimport { initSync, MidiSynth } from ${JSON.stringify(runtimeUrl)};\nregisterMidiProcessor(initSync, MidiSynth);`;
      const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
      try {
        await context.audioWorklet.addModule(url);
        const node = new AudioWorkletNode(context, "th06-midi", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { module: compiledModule } });
        node.__th06Failed = false;
        node.onprocessorerror = () => { node.__th06Failed = true; console.error("MIDI: audio processor failed; using compatibility playback."); };
        node.port.onmessage = ({ data }) => {
          if (data.type === "error") { node.__th06Failed = true; console.error("MIDI:", data.message); }
        };
        return node;
      } finally { URL.revokeObjectURL(url); }
    };
    runtimeApi = runtime;
    syncSuspension();
    return runtime;
  })().catch(err => { runtimePromise = null; throw err; });
  return runtimePromise;
}
function validateManifest(data) {
  if (!data || !data.files || typeof data.files !== "object" || Array.isArray(data.files)) throw new Error(ui("invalidManifest", "La liste des fichiers du site est invalide."));
  const entries = [], names = new Set();
  for (const [key, path] of Object.entries(data.files)) {
    const name = canonicalName(key);
    if (!name || key.includes("/") || key.includes("\\") || names.has(name) || typeof path !== "string") throw new Error(ui("invalidManifestEntry", "Entrée invalide dans la liste des fichiers : {file}", { file: key }));
    const url = new URL(path, location.href);
    if (url.origin !== location.origin || !["http:", "https:"].includes(url.protocol) || url.username || url.password) throw new Error(ui("invalidAssetOrigin", "Les fichiers du jeu doivent provenir de ce site."));
    names.add(name); entries.push([name, url.href]);
  }
  const missing = REQUIRED.filter(name => !names.has(name));
  if (missing.length) throw new Error(ui("incompleteManifest", "La liste du site est incomplète : {files}", { files: missing.join(", ") }));
  return entries;
}
async function readHosted(entries) {
  const map = Object.create(null), controller = new AbortController();
  let index = 0, completed = 0, total = 0;
  async function worker() {
    while (index < entries.length) {
      const [name, url] = entries[index++];
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error(ui("downloadFailed", "{file} : téléchargement impossible ({status}).", { file: name, status: response.status }));
      const advertised = Number(response.headers.get("Content-Length"));
      if (advertised > MAX_FILE) throw new Error(ui("assetTooLarge", "{file} est trop volumineux.", { file: name }));
      const reader = response.body?.getReader();
      if (!reader) throw new Error(ui("streamUnavailable", "Le navigateur ne permet pas la lecture des fichiers du jeu."));
      const chunks = []; let size = 0;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        size += value.byteLength; total += value.byteLength;
        if (size > MAX_FILE || total > MAX_TOTAL) { await reader.cancel(); throw new Error(ui("assetsTooLarge", "Les fichiers dépassent la capacité de chargement du navigateur.")); }
        chunks.push(value);
      }
      const bytes = new Uint8Array(size); let offset = 0;
      for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
      map[name] = bytes;
      status.textContent = ui("loadingFiles", "Chargement du jeu : {completed} / {total}", { completed: ++completed, total: entries.length });
    }
  }
  try { await Promise.all([worker(), worker()]); return complete(map); }
  catch (err) { controller.abort(); throw err; }
}
async function startGame() {
  if (busy || document.body.classList.contains("playing")) return;
  busy = true; error.textContent = ""; $("retry").classList.add("hidden");
  let map;
  try {
    map = await readHosted(manifest);
    status.textContent = ui("startingGame", "Démarrage du jeu…");
    const runtime = await loadRuntime();
    await runtime.start_game(map);
    document.body.classList.add("playing");
    syncSuspension();
    const canvas = $("th06-canvas");
    if (canvas) { canvas.addEventListener("dblclick", toggleFullscreen); canvas.focus(); }
    status.textContent = "";
  } finally {
    // Rust owns its copies once start_game resolves. Release the JS references.
    if (map) for (const name of Object.keys(map)) delete map[name];
    busy = false;
  }
}
$("retry").addEventListener("click", () => location.reload());
function toggleFullscreen() {
  const canvas = $("th06-canvas"); if (!canvas) return;
  const action = document.fullscreenElement ? document.exitFullscreen() : canvas.requestFullscreen();
  action?.catch(() => { $("persistenceError").textContent = ui("fullscreenDenied", "Le navigateur a refusé le plein écran."); });
}
$("fsBtn").addEventListener("click", toggleFullscreen);
window.addEventListener("keydown", event => {
  if ($("dataDialog").open || window.__th06CommunityDialogOpen?.()) return;
  if ((event.key === "f" || event.key === "F") && document.body.classList.contains("playing")) { event.preventDefault(); toggleFullscreen(); }
}, true);

// Save data is handled by Rust's validated score/T6RP parsers. Nothing is uploaded.
const dialog = $("dataDialog"), dataStatus = $("dataStatus");
function syncSuspension() { runtimeApi?.set_suspended(document.hidden || $("dataDialog").open || Boolean(window.__th06CommunityDialogOpen?.())); }
window.__th06SyncSuspension = syncSuspension;
document.addEventListener("visibilitychange", syncSuspension);
for (let slot = 0; slot < 15; slot++) $("replaySlot").add(new Option(String(slot + 1).padStart(2, "0"), String(slot)));
$("gameTools").addEventListener("click", () => { dataStatus.textContent = ""; dialog.showModal(); syncSuspension(); });
$("closeData").addEventListener("click", () => { dialog.close(); $("th06-canvas")?.focus(); });
dialog.addEventListener("close", () => { syncSuspension(); $("th06-canvas")?.focus(); });
// Do not send dialog keystrokes to winit's global keyboard listeners.
for (const type of ["keydown", "keyup"]) dialog.addEventListener(type, event => event.stopPropagation());
function download(name, bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  const link = document.createElement("a"); link.href = url; link.download = name; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function dataAction(action) {
  try { await action(await loadRuntime()); dataStatus.textContent = ui("done", "Terminé."); }
  catch (err) { dataStatus.textContent = err?.message || String(err); }
}
$("importScore").addEventListener("click", () => $("scoreFile").click());
$("importReplay").addEventListener("click", () => $("replayFile").click());
$("scoreFile").addEventListener("change", async event => {
  const file = event.target.files[0]; event.target.value = "";
  if (file) dataAction(async runtime => {
    if (file.size > 16 * 1024 * 1024) throw new Error(ui("saveTooLarge", "Sauvegarde trop volumineuse."));
    runtime.import_score(new Uint8Array(await file.arrayBuffer()));
  });
});
$("replayFile").addEventListener("change", async event => {
  const file = event.target.files[0], slot = Number($("replaySlot").value); event.target.value = "";
  if (file) dataAction(async runtime => {
    if (file.size > 16 * 1024 * 1024) throw new Error(ui("replayTooLarge", "Replay trop volumineux."));
    runtime.import_replay(new Uint8Array(await file.arrayBuffer()), slot);
  });
});
$("exportScore").addEventListener("click", () => dataAction(runtime => download("score.dat", runtime.export_score())));
$("exportReplay").addEventListener("click", () => dataAction(runtime => {
  const slot = Number($("replaySlot").value);
  download("th6_" + String(slot + 1).padStart(2, "0") + ".rpy", runtime.export_replay(slot));
}));

(async function boot() {
  status.textContent = ui("loadingGame", "Chargement du jeu…");
  try {
    const [build, hosted] = await Promise.all([
      fetch("./build.json", { cache: "no-store" }).then(response => response.ok ? response.json() : null),
      fetch("./assets.json", { cache: "no-cache" }).then(response => {
        if (!response.ok) throw new Error(ui("assetsUnavailable", "Les ressources du jeu sont indisponibles. Réessayez dans un instant."));
        return response.json();
      }),
    ]);
    if (typeof build?.version === "string") version = build.version.slice(0, 128);
    window.__th06BuildVersion = version;
    manifest = validateManifest(hosted);
    await startGame();
  } catch (err) {
    console.error(err);
    error.textContent = ui("startError", "Le jeu n’a pas pu démarrer : {message}", { message: err?.message || String(err) });
    status.textContent = "";
    document.body.classList.remove("playing");
    $("th06-canvas")?.remove();
    $("retry").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
